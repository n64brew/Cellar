<!DOCTYPE html>
<html>
    <head>
        <title>ROMs</title>
        <link rel="shortcut icon">
        <link href="roms/roms.css" rel="stylesheet" type="text/css">
        <meta property="og:type" content="website">
        <meta property="og:url" content="https://cellar.n64brew.dev/roms.html">
        <meta property="og:title" content="ROMs">
        <meta property="og:image" content="https://cellar.n64brew.dev/logo.png">
        <meta property="og:description" content="N64 homebrew ROM collection." />
    </head>
    
    <body>
        <div class="box">
            <h1>ROMs</h1>
            <p>This page is a collection of N64 homebrew ROMs.</p>
            <h5>Last updated _TEMPLATE_ROMS_DATE_</h5>
            <hr>

            <div id="rom-filter-header" class="rom-filter-header" hidden>
                <center>
                    <span id="filter-count" role="status" aria-live="polite"></span><br></br>
                    <button id="filter-toggle" type="button" aria-expanded="false" aria-controls="rom-filters">Filters</button>
                </center>
            </div>
            <form id="rom-filters" class="rom-filters" hidden>
                <label for="filter-name">Name
                    <input id="filter-name" type="search" autocomplete="off">
                </label>
                <label for="filter-author">Author
                    <input id="filter-author" type="search" autocomplete="off">
                </label>
                <label for="filter-genre">Genre
                    <select id="filter-genre"><option value="">All genres</option></select>
                </label>
                <label for="filter-tag">Tag
                    <select id="filter-tag"><option value="">All tags</option></select>
                </label>
                <label for="filter-age">Age rating
                    <select id="filter-age"><option value="">All ratings</option></select>
                </label>
                <label for="filter-ai">AI disclosure
                    <select id="filter-ai">
                        <option value="">Any</option>
                        <option value="yes">Present</option>
                        <option value="no">Not present</option>
                    </select>
                </label>
                <button id="filter-clear" type="button">Clear filters</button>
            </form>
            <p id="filter-empty" hidden>No ROMs match these filters.</p>
            
_TEMPLATE_ROMS_LIST_
            
            <hr>
            <td><a href="..">Return to home</a></td>
        </div>
        <script src="roms/roms.js"></script>
    </body>
</html>
